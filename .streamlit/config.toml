[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f6f8fc"
secondaryBackgroundColor = "#eef2f8"
textColor = "#0f172a"
borderColor = "#e2e8f0"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#f1f5f9"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false

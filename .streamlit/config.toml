[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#070b16"
secondaryBackgroundColor = "#121a2c"
textColor = "#e2e8f0"
borderColor = "#1e293b"
linkColor = "#60a5fa"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#0f172a"
dataframeBorderColor = "#1e293b"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false
